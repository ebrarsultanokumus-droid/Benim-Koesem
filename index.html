<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Benim Köşem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B1A2E">
<script>try{var _s=(JSON.parse(localStorage.getItem('koesem.v1')||'{}').settings)||{},_h=document.documentElement;_h.dataset.logo=_s.logo||'dunkel';if(_s.splash===false)_h.dataset.splash='0'}catch(e){document.documentElement.dataset.logo='dunkel'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Fraunces:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&family=Dancing+Script:wght@500;700&family=Special+Elite&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Tumblr-artiges Dashboard. Telefon = eine Spalte + Leiste unten, Tablet/Laptop = Seitenleiste links + breiter Inhalt */
  --bg:#0B1A2E;--wblur:0px;--dim:.25;--accent:#E94B8A;--accentInk:#FFFFFF;--radius:16px;
  --pageInk:#F3F6FA;--pageInk2:rgba(243,246,250,.66);
  --card:#FFFFFF;--cardInk:#14202E;--cardInk2:rgba(20,32,46,.6);--blur:0px;--shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.14);
  --sbg:#FFFFFF;--sink:#14202E;--sink2:rgba(20,32,46,.6);--sfld:#F1F4F8;
  --dock:rgba(12,24,42,.92);--dockInk:#F3F6FA;--dockInk2:rgba(243,246,250,.6);
  --chip:rgba(127,127,127,.16);--line:rgba(127,127,127,.26);--danger:#E5484D;--ok:#2FA36B;--warn:#E8A03A;
  --fh:'Fraunces',Georgia,serif;--fb:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;--scale:1;
  --side:0px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--pageInk);font:400 15px/1.5 var(--fb);min-height:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--cardInk)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:14px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));zoom:var(--scale)}

/* Wallpaper */
#wall{position:fixed;inset:0;z-index:0}
.wl{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.wl-img{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(var(--wblur))}
.wl-dim{position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
.wl-img:not([style*="background-image"]) + .wl-dim{background:transparent}

/* Text */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h1{font-family:var(--fh);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.08;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--pageInk2);font-size:14px;font-weight:500}
.lead{font-size:17px;margin:14px 0}
.sec{font-family:var(--fb);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--pageInk2);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font:500 13px var(--fb);color:var(--pageInk2)}
.sh{font-family:var(--fh);font-size:27px;font-weight:700;margin:4px 0 6px;color:var(--cardInk)}
.sh2{font-family:var(--fh);font-size:20px;font-weight:700;margin:26px 0 6px;color:var(--cardInk)}
.hint{color:var(--cardInk2);font-size:13.5px;margin:0 0 10px}
.dayh{margin:14px 2px 6px;font-weight:600;font-size:13.5px;color:var(--pageInk2)}
.bad{color:var(--danger)!important}
.empty{text-align:center;color:var(--pageInk2);padding:26px 14px;font-size:14.5px}

/* Atoms */
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--cardInk);display:grid;place-items:center;flex:none;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.card{background:var(--card);color:var(--cardInk);border-radius:var(--radius);padding:18px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);color:var(--cardInk);border-radius:calc(var(--radius) * .65);padding:12px 14px;margin-bottom:8px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.row .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.rtime{width:50px;flex:none;font-size:12.5px;color:var(--cardInk2);display:flex;flex-direction:column;line-height:1.25}
.rtime b{color:var(--cardInk);font-weight:650;font-size:14px}
.rbody{flex:1;min-width:0;display:block}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rt.wrap{white-space:normal}
.rs{font-size:13px;color:var(--cardInk2);display:block}
.done{text-decoration:line-through;opacity:.55}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:15px;height:15px;stroke-width:3}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.chk.sm{width:20px;height:20px;border-width:1.8px}.chk.sm svg{width:12px;height:12px}
.pb{min-width:24px;height:24px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none;padding:0 6px}
.pill{padding:5px 12px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:12.5px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.red{background:var(--danger);color:#fff}
.pill.big{padding:10px 18px;font-size:14.5px}
.seg{display:flex;background:var(--card);border-radius:16px;padding:3px;margin:14px 0}
.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:13px;font-weight:600;font-size:14px;color:var(--cardInk2)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);color:var(--cardInk);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;position:relative;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.chip.on{background:var(--accent);color:var(--accentInk)}
.chip svg{width:16px;height:16px}
.chip .cdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.round,.chip.round.on{width:34px;height:34px;padding:0;justify-content:center;border:3px solid transparent;background:var(--cc)}
.chip.round.on{border-color:var(--cardInk)}
.chip.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.cpick{position:relative;width:38px;height:38px;border-radius:50%;background:var(--cc);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.cpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px;transition:width .4s}
.search{width:100%;background:var(--card);color:var(--cardInk);border:0;border-radius:18px;padding:13px 16px;outline:none;margin:14px 0 10px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.search::placeholder,.fld::placeholder,.li-in::placeholder,.cta::placeholder{color:var(--cardInk2)}
.grip{width:34px;height:34px;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;flex:none;cursor:grab}
.grip svg{fill:currentColor;stroke:none;width:20px;height:20px}

/* Home */
.homebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 14px;min-height:42px}
.hb{display:flex;gap:8px;margin-left:auto}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.widget{position:relative;grid-column:span 1;background:var(--card);color:var(--cardInk);border-radius:var(--radius);padding:16px;min-height:150px;overflow:hidden;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);min-width:0}
.widget.sz-M,.widget.sz-L{grid-column:span 2}
.widget.sz-L{min-height:320px}
.w-dark{--card:rgba(13,24,40,.96);--cardInk:#EEF2F7;--cardInk2:rgba(238,242,247,.62);--blur:0px;--chip:rgba(255,255,255,.08)}
.w-light{--card:#FFFFFF;--cardInk:#14202E;--cardInk2:rgba(20,32,46,.6);--blur:0px}
.w-glass{--card:rgba(255,255,255,.2);--cardInk:#fff;--cardInk2:rgba(255,255,255,.75);--blur:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.w-clear{--card:transparent;--cardInk:var(--pageInk);--cardInk2:var(--pageInk2);--blur:0px;box-shadow:none}
.w-accent{--card:var(--accent);--cardInk:var(--accentInk);--cardInk2:var(--accentInk);--blur:0px}
.widget .row{background:var(--chip);margin-bottom:6px}
.whead{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-weight:700;font-size:14px;margin-bottom:10px;gap:8px}
.whead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whead b{font-family:var(--fh);font-size:30px;font-weight:700;line-height:1}
.mi{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;min-width:0}
.mi>i{width:8px;height:8px;border-radius:50%;flex:none}
.mt{font-size:12px;color:var(--cardInk2);flex:none;min-width:44px}
.mx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.bd{padding:4px 0}.bd b{display:block;font-family:var(--fh);font-size:19px}
.clk{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:118px}
.clk-g{font-size:13.5px;color:var(--cardInk2);font-weight:500}
.clk-t{font-family:var(--fh);font-size:68px;font-weight:700;line-height:1;letter-spacing:-.02em;margin:2px 0}
.clk.sz-S .clk-t{font-size:42px}
.clk-d{font-size:15px;font-weight:500}
.qt{font-family:var(--fh);font-style:italic;font-size:21px;line-height:1.28;display:block;width:100%;white-space:pre-wrap;word-break:break-word}
.widget.sz-S .qt{font-size:16px}
.qa{margin-top:10px;font-size:13px;color:var(--cardInk2);display:block}
.wt-photo,.wt-strip,.wt-mood{padding:0}
.wt-strip{padding:6px}
.ph{display:block;width:100%;background-size:cover;background-position:center;background-color:var(--chip);position:relative;border-radius:calc(var(--radius) * .75);overflow:hidden;color:var(--cardInk2);font-size:13px;text-align:center}
.wt-photo .ph{border-radius:0;aspect-ratio:1}
.wt-photo.sz-M .ph{aspect-ratio:16/10}.wt-photo.sz-L .ph{aspect-ratio:4/5}
.ph span{position:absolute;inset:0;display:grid;place-items:center}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-style:normal;font-family:var(--fh);font-size:16px;text-align:left}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.strip .ph{aspect-ratio:3/4;border-radius:calc(var(--radius) * .6)}
.mood{display:grid;gap:3px;width:100%}
.mood.c3{grid-template-columns:repeat(3,1fr)}.mood.c4{grid-template-columns:1fr 1fr}.mood.c6{grid-template-columns:repeat(3,1fr)}
.mood .ph{aspect-ratio:1;border-radius:0}
.wedit{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;justify-content:space-between;padding:8px;gap:6px;color:#fff;font-weight:600;font-size:13px}
.wedit>span{align-self:center;text-align:center;flex:1}
.wedit button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);color:#222;display:grid;place-items:center}
.wedit .grip svg{fill:#222}
.wbtns{display:flex;gap:6px}
.widget.sz-S .wedit>span:not(.wbtns){display:none}
.widget.sz-S .wedit{justify-content:space-between;padding:6px}
.widget.sz-S .wedit button{width:34px;height:34px}
.wgrid.editing .wbody{pointer-events:none;opacity:.8}
.widget.dragging{opacity:.5;transform:scale(.96)}
.addw{display:block;width:100%;margin-top:12px;border:2px dashed var(--pageInk2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--pageInk);font-weight:600}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.trow.dragging{opacity:.5}

/* Calendar */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .t{font-family:var(--fh);font-weight:700;font-size:32px;line-height:1.05}
.mnav .t small{display:block;font:500 14px var(--fb);color:var(--pageInk2)}
.mbtns{display:flex;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--cardInk2);padding:2px 0 6px}
.cd{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.sel{background:var(--accent);color:var(--accentInk)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cd.sel .dot{background:var(--accentInk);opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 2px 0;font-size:12.5px;color:var(--pageInk2);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}

/* Budget */
.bal{font-family:var(--fh);font-weight:700;font-size:46px;line-height:1;margin:4px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two b{display:block;font-family:var(--fh);font-size:22px;font-weight:700}
.two span{font-size:13px;color:var(--cardInk2)}
.catrow{margin-bottom:12px}
.catrow .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.catrow .l span:last-child{color:var(--cardInk2);font-weight:500}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--ok)}

/* Notes, know, board, quotes */
.ngrid{columns:2;column-gap:10px}
.nc{break-inside:avoid;margin-bottom:10px;border-radius:calc(var(--radius) * .8);padding:14px;background:var(--nbg,var(--card));color:var(--cardInk);display:block;width:100%;cursor:pointer}
.nc.pastel{--cardInk:#2A2420;--cardInk2:rgba(42,36,32,.62);--line:rgba(42,36,32,.3)}
.nc h4{margin:0 0 5px;font-family:var(--fh);font-size:18px;font-weight:700;line-height:1.2}
.nc p{margin:0;font-size:13.5px;color:var(--cardInk2);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nc .it{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.nc .meta{font-size:12px;color:var(--cardInk2);margin-top:6px}
.kc{display:block;width:100%;margin-bottom:10px;padding:16px}
.kc h4{margin:0 0 6px;font-family:var(--fh);font-size:21px;line-height:1.15}
.kc p{margin:0;color:var(--cardInk2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--cardInk)}
.thumbs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.thumbs .ph{width:64px;height:64px;flex:none;border-radius:12px}
.qc{display:block;width:100%;margin-bottom:10px;padding:22px 20px}
.qc q{display:block;font-family:var(--fh);font-style:italic;font-size:22px;line-height:1.3;quotes:none;white-space:pre-wrap;word-break:break-word}
.qc span{display:block;margin-top:10px;font-size:13.5px;color:var(--cardInk2)}
.masonry{columns:2;column-gap:8px}
.mp{display:block;width:100%;break-inside:avoid;margin-bottom:8px;border-radius:calc(var(--radius) * .6);overflow:hidden;background:var(--card);position:relative}
.mp .ph{border-radius:0;aspect-ratio:var(--ar,1)}
.mp em{display:block;position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12.5px;font-style:normal}
.bigimg{width:100%;border-radius:18px;display:block;margin-bottom:10px}

/* Birthdays */
.bmeta .av,.post .av,.comp .av{border-radius:24%}
.av{width:44px;height:44px;border-radius:50%;background:var(--c,var(--accent));color:#fff;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:19px;flex:none;background-size:cover;background-position:center}
.bhero{display:flex;gap:14px;align-items:center}
.bhero b{font-family:var(--fh);font-size:26px;display:block;line-height:1.1}

/* Blog */
.bhead{border-radius:var(--radius);overflow:hidden;background:var(--card);color:var(--cardInk);position:relative;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.bban{height:130px;background-size:cover;background-position:center;background-color:var(--chip)}
.bmeta{padding:0 18px 16px;margin-top:-30px;position:relative}
.bmeta .av{width:68px;height:68px;font-size:28px;border:4px solid var(--sbg);}
.bmeta h2{font-family:var(--fh);font-size:26px;margin:8px 0 2px}
.comp{margin-top:14px}
.comp-r{display:flex;gap:12px}
.cta{flex:1;background:transparent;border:0;outline:none;resize:none;color:var(--cardInk);font-size:16.5px;line-height:1.45;min-height:70px}
.comp-b{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tools{display:flex;gap:2px}
.tools button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--accent)}
.tools button.on{background:var(--chip)}
.btn.sm{display:inline-block;width:auto;padding:10px 20px;margin:0;font-size:14.5px}
.att{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
.att .ph{width:84px;height:84px;flex:none;border-radius:14px}
.att .ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.att .ph button svg{width:14px;height:14px}
.post{margin-top:14px;padding:0;overflow:hidden}
.post header{display:flex;gap:12px;align-items:center;padding:14px 16px 10px}
.post header b{display:block;font-family:var(--fh);font-size:17px}
.pmedia{display:grid;gap:3px;grid-template-columns:1fr 1fr}
.pmedia>*:only-child,.pmedia>*:nth-child(odd):last-child{grid-column:span 2}
.pmedia img,.pmedia video{width:100%;display:block;object-fit:cover;max-height:520px;background:var(--chip)}
.pmedia.multi img,.pmedia.multi video{aspect-ratio:1}
.ptxt{padding:12px 16px 4px;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.5}

/* Sheet & studio */
#veil{position:fixed;inset:0;background:rgba(10,8,8,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#veil.open{opacity:1;pointer-events:auto}
#sheet,#studio{--card:var(--sfld);--cardInk:var(--sink);--cardInk2:var(--sink2);--blur:0px;--shadow:none;--line:rgba(127,127,127,.3);color:var(--sink)}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow:auto;background:var(--sbg);border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:40;overscroll-behavior:contain}
#sheet.open{transform:none}
#studio{position:fixed;inset:0;z-index:50;background:var(--sbg);overflow:auto;display:none;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
#studio.open{display:block}
.st{max-width:520px;margin:0 auto}
.st-top{position:sticky;top:0;z-index:5;background:var(--sbg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px}
.st-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.st-bar b{font-family:var(--fh);font-size:20px}
.pv{position:relative;border-radius:22px;overflow:hidden;height:150px}
.pv-in{position:absolute;inset:0;padding:10px;display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.pv .widget{min-height:0;padding:12px;font-size:13px}
.pv .clk{min-height:0}.pv .clk-t{font-size:40px}
.st-body{padding:4px 16px 20px}
.st-body .box{--card:rgba(127,127,127,.2);background:var(--sfld);border-radius:22px;padding:6px 16px 16px;margin-bottom:12px}
.rng{width:100%;accent-color:var(--accent);margin:4px 0}
#sheet .chip:not(.on):not(.round){box-shadow:inset 0 0 0 1px var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.lab{font-size:13px;font-weight:600;color:var(--cardInk2);margin:15px 0 6px;display:block}
.fld{width:100%;background:var(--card);color:var(--cardInk);border:1.5px solid transparent;border-radius:15px;padding:12px 14px;outline:none;min-height:48px;appearance:none;-webkit-appearance:none}
.fld:focus{border-color:var(--accent)}
textarea.fld{resize:none;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;background:var(--accent);color:var(--accentInk);border-radius:17px;padding:15px;font-weight:700;text-align:center;width:100%;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--cardInk)}
.btn.danger{background:transparent;color:var(--danger)}
.tgl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 2px;gap:12px;color:var(--cardInk)}
.tgl .sw2{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex:none}
.tgl .sw2::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on .sw2{background:var(--accent)}.tgl.on .sw2::after{left:23px}
.li{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.li-in{flex:1;background:var(--card);color:var(--cardInk);border:1.5px solid transparent;border-radius:13px;padding:10px 12px;outline:none;min-width:0}
.li-in:focus{border-color:var(--accent)}
.x{width:34px;height:34px;color:var(--cardInk2);display:grid;place-items:center;flex:none}
.addli{color:var(--accent);font-weight:650;padding:8px 2px;display:block}
.slot{display:flex;gap:12px;align-items:center;margin:6px 0}
.slot .thumb{width:64px;height:64px;border-radius:14px;background:var(--chip) center/cover no-repeat;flex:none}
.moodg{display:flex;flex-wrap:wrap;gap:8px}

/* Namaz & Zikir */
.ar{font-family:'Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;text-align:center;font-size:34px;line-height:1.6}
.ar.sm{font-size:22px;line-height:1.4}
.pn{font-family:var(--fh);font-size:30px;font-weight:700;line-height:1.1}
.pn.big{font-size:40px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}
.dnav b{font-family:var(--fh);font-size:20px;text-align:center;flex:1}
.prow{display:flex;gap:12px;align-items:center;background:var(--card);color:var(--cardInk);border-radius:calc(var(--radius) * .65);padding:10px 14px;margin-bottom:8px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.prow.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.ptime{font-family:var(--fh);font-size:22px;font-weight:700;margin-left:auto}
.pst{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:transparent}
.pst svg{width:18px;height:18px;stroke-width:3}
.pst.s1{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.pst.s2{background:var(--warn);border-color:var(--warn);color:#fff}
.pst.none{border-color:transparent;color:var(--cardInk2)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px}
.pg{text-align:center;padding:6px 0;border-radius:12px;font-size:11px;color:var(--cardInk2)}
.pg b{display:block;font-size:13px;color:var(--cardInk)}
.pg.on{background:var(--chip)}
.pdots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.pcol small{font-size:10.5px;color:var(--cardInk2)}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:10px 0}
.wkgrid small{display:block;font-size:12px;color:var(--cardInk2);margin-bottom:6px}
.wkd.t small{color:var(--accent);font-weight:700}
.wkdots{display:flex;flex-direction:column;gap:5px;align-items:center}
.wkdots i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.wkdots i.d1{background:var(--accent)}.wkdots i.d2{background:var(--warn)}
.zbtn{position:relative;display:block;width:min(74vw,290px);aspect-ratio:1;margin:12px auto;border-radius:50%;background:var(--card);color:var(--cardInk);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.zbtn.pop{animation:zpop .18s ease-out}
@keyframes zpop{0%{transform:scale(.95)}100%{transform:scale(1)}}
.zbtn svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:10}
.zbg{fill:none;stroke:var(--line)}
.zfg{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .12s}
.zc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zc b{font-family:var(--fh);font-size:72px;font-weight:700;line-height:1}
.zc small{font-size:14px;color:var(--cardInk2)}
.zbtn.mini{width:96px;margin:6px 0 0;border-radius:50%;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.zbtn.mini b{font-family:var(--fh);font-size:34px;line-height:1}
.zbtn.mini small{font-size:11px;color:var(--cardInk2)}
.nowrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.nowrap::-webkit-scrollbar{display:none}
.nowrap .chip{flex:none}

/* Chrome */
#fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:58px;height:58px;border-radius:calc(var(--radius) * .75);background:var(--accent);color:var(--accentInk);display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.3);z-index:15}
#fab svg{width:26px;height:26px;stroke-width:2.4}
#tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}
.pillbar{display:flex;gap:2px;background:var(--dock);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-radius:28px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none}
.pillbar::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:22px;font-size:10.5px;font-weight:650;color:var(--dockInk2);white-space:nowrap}
.tab.on{color:var(--tink,var(--accentInk));background:var(--tacc,var(--accent))}
.tab .emo{font-size:20px;line-height:22px;height:22px;display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);background:var(--pageInk);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== Logo, Startanimation ===== */
html[data-logo=dunkel]{--lg:#4A0E2A}
html[data-logo=rosa]{--lg:#FFB3D1}
html[data-logo=weiss]{--lg:#FFF0F5}
html[data-logo=pink]{--lg:#FF6FA8}
svg.lg{stroke:none;stroke-width:0;fill:none;height:auto;overflow:visible}
#splash{position:fixed;inset:0;z-index:200;background:var(--lg,#4A0E2A);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html[data-splash="0"] #splash:not(.play){display:none}
#splash.out{animation:spOut .5s cubic-bezier(.4,0,.2,1) forwards}
#splash.gone{display:none!important}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,5vh,40px);padding:24px}
svg.sp-mark{width:clamp(120px,38vmin,190px)}
svg.sp-word{width:clamp(190px,62vmin,300px)}
@media (orientation:landscape){.sp-in{flex-direction:row;gap:36px}svg.sp-mark{width:clamp(110px,36vmin,190px)}svg.sp-word{width:clamp(180px,54vmin,300px)}}
.sp-in svg *{transform-box:fill-box;transform-origin:center}
.sp-in .sp-body{animation:spPop .65s cubic-bezier(.34,1.56,.64,1) .05s both}
.sp-in .sp-dot{animation:spDot .45s cubic-bezier(.34,1.56,.64,1) .45s both}
.sp-in .sp-heart{transform-origin:50% 75%;animation:spHeart .5s cubic-bezier(.34,1.56,.64,1) .6s both,spBeat .55s ease-in-out 1.05s 2}
.sp-in .sp-w1{animation:spUp .55s cubic-bezier(.2,.8,.2,1) .8s both}
.sp-in .sp-w2{animation:spUp .55s cubic-bezier(.2,.8,.2,1) .95s both}
@keyframes spPop{from{opacity:0;transform:scale(.3) rotate(-14deg)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes spDot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes spHeart{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes spBeat{0%,100%{transform:scale(1)}30%{transform:scale(1.24)}60%{transform:scale(.97)}}
@keyframes spUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;transform:scale(1.07)}}
body.enter #app{animation:appIn .7s cubic-bezier(.2,.8,.2,1) both}
body.enter #tabs,body.enter #fab{animation:dockIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dockIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#splash *{animation:none!important}#splash.out{animation:none!important;opacity:0}body.enter #app,body.enter #tabs,body.enter #fab{animation:none!important}}
.homelogo{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 7px;border-radius:99px;background:var(--lg,#4A0E2A);flex:none;box-shadow:var(--shadow)}

function tick(){
  const n = new Date();
  document.querySelectorAll('[data-clock]').forEach(el => {
    const k = el.dataset.clock;
    if (k === 'time') el.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}` + (el.dataset.s ? `:${pad(n.getSeconds())}` : '');
    else if (k === 'date') el.textContent = isTr() ? `${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()} ${WDL[wdIdx(n)]}` : `${WDL[wdIdx(n)]}, ${n.getDate()}. ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
    else el.textContent = greeting();
  });
  const now = Date.now(); let expired = false;
  document.querySelectorAll('[data-cd]').forEach(el => {
    const rem = Number(el.dataset.cd) - now;
    if (rem <= 0){ expired = true; return; }
    el.textContent = el.dataset.cdf === 'big' ? fmtHMS(rem) : 'in ' + fmtCd(rem);
  });
  if (expired && now - (V.cdRender || 0) > 3000){ V.cdRender = now; render(); }
}

const toMin = h => { const [a, b] = (h || '0:0').split(':').map(Number); return a * 60 + (b || 0); };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
function busyOn(d, withPrayer){
  const out = [];
  dayItems(d).forEach(e => { if (e.start){ const a = toMin(e.start), b = e.end ? Math.max(toMin(e.end), a + 15) : a + 60; out.push({a, b, title:e.title}); } });
  if (withPrayer){ const L = getLoc(); const tt = L && prayerTimes(d, L); if (tt) ['dhuhr', 'asr', 'maghrib', 'isha'].forEach(k => { const m = toMin(fmtClock(tt[k], tzOf(L))); out.push({a:m, b:m + 15, title:PNAMES[k][0]}); }); }
  return out.sort((x, y) => x.a - y.a);
}
function freeSlots(d, minLen = 30, from, to, withPrayer = false){
  let s0 = toMin(from || S.settings.dayStart || '08:00'), e0 = toMin(to || S.settings.dayEnd || '22:00');
  if (d === today()){ const n = new Date(); s0 = Math.max(s0, Math.ceil((n.getHours() * 60 + n.getMinutes()) / 15) * 15); }
  const res = []; let cur = s0;
  busyOn(d, withPrayer).forEach(b => { if (b.a > cur && Math.min(b.a, e0) - cur >= minLen) res.push({a:fromMin(cur), b:fromMin(Math.min(b.a, e0)), min:Math.min(b.a, e0) - cur}); cur = Math.max(cur, b.b); });
  if (e0 - cur >= minLen) res.push({a:fromMin(cur), b:fromMin(e0), min:e0 - cur});
  return res;
}

function vBday(){

function spDelete(id, all){
  const keys = ['todos', 'notes', 'events', 'tx', 'know', 'quotes', 'board'];
  keys.forEach(k => {
    if (all){
      S[k].filter(x => x.sp === id).forEach(x => { if (k === 'notes') delete S.ink[x.id]; if (k === 'board') mDel(x.mid); (x.imgs || []).forEach(mDel); });
      S[k] = S[k].filter(x => x.sp !== id);
    } else S[k].forEach(x => { if (x.sp === id) delete x.sp; });
  });
  S.tools = S.tools.filter(t => t.id !== id);
  if (V.view === id) V.view = 'home';
}

const D2R = Math.PI / 180;

const FW = [[400, 'Normal'], [600, 'Halbfett'], [800, 'Fett']];

const getP = path => path.startsWith('draft.') ? path.slice(6).split('.').reduce((o, k) => o == null ? o : o[k], V.draft) : getF(path);
function setP(path, v){
  if (path.startsWith('draft.')){ const a = path.slice(6).split('.'); let o = V.draft; while (a.length > 1){ const k = a.shift(); if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; } o[a[0]] = v; }
  else { const a = path.split('.'); let o = F; while (a.length > 1){ const k = a.shift(); if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; } o[a[0]] = v; }
}
function fmtCss(f, own){
  const e = own ? (f || {}) : {...(S.settings.fmt || {}), ...(f || {})}, out = [];
  if (e.f && FONTS.some(x => x.n === e.f)) out.push(`font-family:${fam(e.f)}`);
  if (e.w) out.push(`font-weight:${Number(e.w)}`);
  if (e.i === 1 || e.i === 0) out.push(`font-style:${e.i ? 'italic' : 'normal'}`);
  if (e.u) out.push('text-decoration:underline');
  if (e.s && e.s !== 1) out.push(`font-size:${Number(e.s)}em`);
  if (['left', 'center', 'right'].includes(e.a)) out.push(`text-align:${e.a}`);
  if (e.c && /^#[0-9a-f]{6}$/i.test(e.c)) out.push(`color:${e.c}`);
  return out.join(';');
}
function fmtText(t){
  return esc(t).replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>').replace(/__([\s\S]+?)__/g, '<u>$1</u>').replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<i>$2</i>');
}
function fmtBar(path, own){

    <div class="fb-row"><span class="lbl">Dicke</span>${FW.map(([v, n]) => b('w', v, n, `style="font-weight:${v}"`)).join('')}</div>
    <div class="fb-row"><span class="lbl">Stil</span><button type="button" class="fb-b ${f.i ? 'on' : ''}" data-act="fmtSet" data-p="${path}" data-k="i" data-v="${f.i ? '' : 1}"><i>Kursiv</i></button><button type="button" class="fb-b ${f.i === 0 ? 'on' : ''}" data-act="fmtSet" data-p="${path}" data-k="i0" data-v="1">Gerade</button><button type="button" class="fb-b ${f.u ? 'on' : ''}" data-act="fmtSet" data-p="${path}" data-k="u" data-v="${f.u ? '' : 1}"><u>Unterstrichen</u></button></div>
    <div class="fb-row"><span class="lbl">Größe</span>${FS.map(([v, n]) => b('s', v, n)).join('')}</div>

    ${own ? '' : `<div class="fb-row"><span class="lbl">Markiertes</span><button type="button" class="fb-b" data-act="fmtWrap" data-p="${path}" data-m="**"><b>F</b></button><button type="button" class="fb-b" data-act="fmtWrap" data-p="${path}" data-m="*"><i>K</i></button><button type="button" class="fb-b" data-act="fmtWrap" data-p="${path}" data-m="__"><u>U</u></button><span class="hint" style="margin:0;font-size:12px">Wort im Text markieren, dann tippen</span></div>`}
  </div>`;
}
const fmtPv = (path, text) => `<div class="fpv-l">Vorschau</div><div class="fpv ut" data-fmtpv="${path}" style="${fmtCss(getP(path))}">${fmtText(text || '')}</div>`;
function refreshFmt(path){
  const own = !!(document.querySelector(`[data-fb="${path}"]`) || {dataset:{}}).dataset.own, css = fmtCss(getP(path), own);

function vNextQuiz(cards){
  const pick = cards.slice().sort((a, b) => (a.box || 0) - (b.box || 0) + (Math.random() - .5) * 3)[0];

}
function vRate(c, r){

  else if (r === 1){ c.box = Math.max(1, c.box || 1); c.due = addDays(today(), 1); }
  else { c.box = Math.min(6, (c.box || 0) + 1); c.due = addDays(today(), BOX_DAYS[c.box]); }
  v.log[today()] = (v.log[today()] || 0) + 1; save();
}

async function aiSend(text){
  text = str(text); if (!text || AI.busy) return;
  const sample = window.claude && window.claude.use ? await claude.use('sample') : null;
  AI.chat.push({r:'u', t:text});
  if (!sample){ AI.chat.push({r:'a', t:'Der Assistent läuft nur, wenn du die App in Claude (claude.ai oder die Claude-App) geöffnet hast und angemeldet bist.'}); saveChat(); render(); return; }
  const msg = {r:'a', t:'Denke nach …', busy:true}; AI.chat.push(msg);
  AI.busy = true; AI.ctl = new AbortController(); render(); scrollChat();
  _acts = {labels:[], undo:[]};
  const hist = AI.chat.slice(0, -2).slice(-10).filter(m => !m.busy && m.t).map(m => ({role:m.r === 'u' ? 'user' : 'assistant', content:m.t}));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const input = [...hist, {role:'user', content:aiContext() + '\n\nNachricht: ' + text}];
  let tools = aiTools();
  try { const lim = await sample.limits(); if (!lim.tools) tools = null; else tools = tools.slice(0, lim.tools.maxCount); } catch(e) {}
  try {
    const opts = {modelTier:'quick', signal:AI.ctl.signal, onText:({text:t}) => { msg.t = t; const el = $('#aibusy'); if (el) el.innerHTML = fmtAi(t); }};
    if (tools) opts.tools = tools; else opts.cache = false;
    const r = await sample(input, opts);
    msg.t = r.text + (r.truncated ? '\n(Antwort gekürzt)' : '');
  } catch(e) {
    const why = {not_granted:'Du hast den Assistenten nicht erlaubt. Du kannst es in den Berechtigungen der Seite ändern.', rate_limited:'Gerade sind zu viele Anfragen. Versuch es in einer Minute noch einmal.', cancelled:'Abgebrochen.', usage_limit:'Dein Nutzungslimit ist erreicht.'}[e && e.code];
    msg.t = (e && e.text ? e.text + '\n\n' : '') + (why || 'Das hat nicht geklappt. Versuch es bitte noch einmal.');
  }
  msg.busy = false; AI.busy = false;
  if (_acts.labels.length){ msg.acts = _acts.labels; const id = uid(); msg.undoId = id; UNDO[id] = _acts.undo; }
  _acts = null; saveChat(); render(); scrollChat();
}

/* ================= Drag & drop sorting ================= */
function initSort(box, sel, done){
  box.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g || !box.contains(g)) return;
    const item = g.closest(sel); if (!item) return;
    e.preventDefault();
    item.classList.add('dragging');
    let y = e.clientY, raf;
    const sc = box.closest('#sheet') || window;
    const step = () => { if (y < 110) sc.scrollBy(0, -14); else if (y > innerHeight - 130) sc.scrollBy(0, 14); raf = requestAnimationFrame(step); };
    step();
    const move = ev => {
      y = ev.clientY;
      item.style.pointerEvents = 'none';
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      item.style.pointerEvents = '';
      const tgt = el && el.closest(sel);
      if (tgt && tgt !== item && tgt.parentElement === box){
        const kids = [...box.children];
        box.insertBefore(item, kids.indexOf(item) < kids.indexOf(tgt) ? tgt.nextSibling : tgt);
      }
    };
    const up = () => {
      cancelAnimationFrame(raf); item.classList.remove('dragging');
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      done([...box.children].filter(c => c.matches(sel)).map(c => c.dataset.wid));
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

const studioColors = (k, label, list, auto) => `<label class="lab">${label}</label><div class="chips">${auto ? `<button class="chip ${!T[k] ? 'on' : ''}" data-act="tSw" data-k="${k}" data-v="">Auto</button>` : ''}${list.map(c => `<button class="chip round ${T[k] === c ? 'on' : ''}" style="--cc:${c}" data-act="tSw" data-k="${k}" data-v="${c}" aria-label="Farbe"></button>`).join('')}<label class="chip" style="position:relative">Eigene<input type="color" data-t="${k}" value="${T[k] || '#ffffff'}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"></label></div>`;
const COLOR_DEFS = [['bg','Hintergrund','Fläche hinter allem'],['pageInk','Text auf dem Hintergrund','Überschriften und Untertitel'],['card','Karten','Widgets, Listen, Beiträge'],['cardInk','Text auf Karten',''],['accent','Akzent','Buttons, aktive Tabs, Häkchen'],['accentInk','Text auf dem Akzent',''],['dock','Navigation','Leiste unten oder Seitenleiste'],['dockInk','Text der Navigation',''],['sbg','Fenster','Eingaben und Einstellungen'],['sink','Text in Fenstern',''],['sfld','Eingabefelder',''],['chip','Flächen und Chips','Filter, Markierungen'],['line','Linien und Rahmen',''],['ok','Erfolg und Einnahmen',''],['warn','Warnung',''],['danger','Löschen und Fehler','']];
function toHex(v){
  v = String(v || '').trim(); if (/^#[0-9a-f]{6}$/i.test(v)) return v; if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('');
  const m = v.match(/rgba?\(([^)]+)\)/); if (!m) return '#888888';
  const [r, g, b] = m[1].split(',').map(x => parseFloat(x)); return '#' + [r, g, b].map(x => pad(Math.round(x).toString(16))).join('');
}
function colorRows(){
  const R = document.documentElement.style, C = T.colors || {};
  return COLOR_DEFS.map(([k, n, h]) => {
    const own = k === 'bg' ? false : !!C[k], val = k === 'bg' ? T.bg : (C[k] || toHex(R.getPropertyValue('--' + k)));
    return `<div class="crow"><label class="sw3" style="--cc:${val}"><input type="color" data-tc="${k}" value="${toHex(val)}" aria-label="${esc(n)}"></label><span class="nm">${esc(n)}${h ? `<small>${esc(h)}</small>` : ''}</span><span class="hex">${toHex(val).toUpperCase()}</span>${own ? `<button class="rs2" data-act="tcReset" data-k="${k}">Auto</button>` : ''}</div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (fn) fn(t.dataset, t, e);
});
const onField = e => {
  const t = e.target;
  if (t.dataset.fp){ const p_ = t.dataset.fp, base = p_.slice(0, p_.lastIndexOf('.')); setP(p_, t.value); refreshFmt(base); return; }
  if (t.dataset.fmtta && e.type === 'input'){ const pv = document.querySelector(`[data-fmtpv="${t.dataset.fmtta}"]`); if (pv) pv.innerHTML = fmtText(t.value); }
  if (t.dataset.tc){ if (!T.colors) T.colors = {}; if (t.dataset.tc === 'bg') T.bg = t.value; else T.colors[t.dataset.tc] = t.value; applyTheme(T); const row = t.closest('.crow'); row.querySelector('.sw3').style.setProperty('--cc', t.value); row.querySelector('.hex').textContent = t.value.toUpperCase(); if (e.type === 'change') studioRender(); }
  else if (t.dataset.t){ T[t.dataset.t] = t.type === 'range' ? Number(t.value) : t.value; applyTheme(T); }
  else if (t.dataset.f){
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.num) v = Number(v);
    setF(t.dataset.f, v); refreshPrev();
  }
  else if (t.dataset.li !== undefined) F.items[Number(t.dataset.li)].t = t.value;
  else if (t.dataset.mi !== undefined){ F.items[Number(t.dataset.mi)][t.dataset.mf] = t.value; if (t.dataset.mf === 'color') t.parentElement.style.setProperty('--cc', t.value); }
  else if (t.dataset.tl){ const x = F.tools.find(o => o.id === t.dataset.tl); if (x) x.label = t.value; }
  else if (t.dataset.cq !== undefined){ if (e.type === 'input'){ const c = $('#clist'); if (c) c.innerHTML = cityList(t.value); } }
  else if (t.dataset.d){ V.draft[t.dataset.d] = t.value; if (t.classList.contains('cta')) autosize(t); }
  else if (t.dataset.q && e.type === 'input'){ V[t.dataset.q] = t.value; const k = t.dataset.q, pos = t.selectionStart; render(); const n = document.querySelector(`[data-q=${k}]`); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_) {} } }
};

  const c = LG[lgKey()];
  return `<button class="homelogo" data-act="logoPlay" aria-label="Benim Köşem, Animation abspielen"><svg class="lg hl-mark" viewBox="0 0 190 190" aria-hidden="true">${lgMark(c, 'h')}</svg><svg class="lg hl-word" viewBox="466 172 519 86" aria-hidden="true"><path fill-rule="evenodd" fill="${c.w1}" d="${LG_W1}"/><g transform="translate(255 -92)"><path fill-rule="evenodd" fill="${c.w2}" d="${LG_W2}"/></g></svg></button>`;
}
function splashHTML(k){
  const c = LG[k];
  return `<div class="sp-in"><svg class="lg sp-mark" viewBox="0 0 190 190" role="img" aria-label="Benim Köşem">${lgMark(c, 'sp')}</svg><svg class="lg sp-word" viewBox="466 172 264 178" aria-hidden="true"><g class="sp-w1"><path fill-rule="evenodd" fill="${c.w1}" d="${LG_W1}"/></g><g class="sp-w2"><path fill-rule="evenodd" fill="${c.w2}" d="${LG_W2}"/></g></svg></div>`;
}
function iconPNG(k, size, cb){
  const c = LG[k];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c.bg}"/><g transform="translate(18.75 18.75) scale(.3289)">${lgMark(c, 'i')}</g></svg>`;
  const img = new Image();
  img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.getContext('2d').drawImage(img, 0, 0, size, size); cb(cv.toDataURL('image/png')); } catch(e) {} };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function setLink(rel, id, href, sizes){
  const old = document.getElementById(id), n = document.createElement('link');
  n.rel = rel; n.id = id; if (sizes) n.sizes = sizes; n.href = href;
  old ? old.replaceWith(n) : document.head.appendChild(n);
}
function applyLogo(){
  const k = lgKey();
  document.documentElement.dataset.logo = k;
  iconPNG(k, 180, u => setLink('apple-touch-icon', 'appicon', u, '180x180'));
  iconPNG(k, 64, u => setLink('icon', 'favicon', u, '64x64'));
}
let spT = null;
function playSplash(enter){
  const el = $('#splash'); if (!el) return;
  clearTimeout(spT);
  el.className = 'play'; el.innerHTML = splashHTML(lgKey()); el.onpointerdown = null;
  const finish = () => {
    clearTimeout(spT); el.onpointerdown = null; el.classList.add('out');
    if (enter === true){ document.body.classList.add('enter'); setTimeout(() => document.body.classList.remove('enter'), 900); }
    spT = setTimeout(() => el.classList.add('gone'), 520);
  };
  spT = setTimeout(finish, 2300);
  el.onpointerdown = finish;
}

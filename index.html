<style>
:root{
  --bg:#564135;--wblur:0px;--dim:.25;--accent:#E9CFB6;--accentInk:#1B1714;--radius:26px;
  --pageInk:#FBF6F1;--pageInk2:rgba(251,246,241,.66);
  --card:rgba(17,16,16,.92);--cardInk:#F6F1EC;--cardInk2:rgba(246,241,236,.6);--blur:0px;--shadow:0 8px 28px rgba(0,0,0,.18);
  --sbg:#1D1918;--sink:#F6F1EC;--sink2:rgba(246,241,236,.6);--sfld:#2B2624;
  --dock:rgba(24,21,20,.8);--dockInk:#F6F1EC;--dockInk2:rgba(246,241,236,.6);
  --chip:rgba(127,127,127,.2);--line:rgba(127,127,127,.28);--danger:#E5605F;--ok:#4FB583;--warn:#E8A03A;
  --fh:'Playfair Display',Georgia,serif;--fb:'DM Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;--scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:transparent;color:var(--pageInk);font:400 15px/1.45 var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;font-size:16px;color:var(--cardInk)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;margin:0 auto;padding:14px 16px 150px;zoom:var(--scale)}

/* Wallpaper */
#wall{position:fixed;inset:0;z-index:-1}
.wl{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.wl-img{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(var(--wblur))}
.wl-dim{position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
.wl-img:not([style*="background-image"]) + .wl-dim{background:transparent}

/* Text */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h1{font-family:var(--fh);font-weight:700;font-size:36px;letter-spacing:-.015em;line-height:1.05;margin:4px 0 2px}
.sub{color:var(--pageInk2);font-size:14px;font-weight:500}
.lead{font-size:17px;margin:14px 0}
.sec{font-family:var(--fh);font-weight:700;font-size:20px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font:500 13px var(--fb);color:var(--pageInk2)}
.sh{font-family:var(--fh);font-size:27px;font-weight:700;margin:4px 0 6px;color:var(--cardInk)}
.sh2{font-family:var(--fh);font-size:20px;font-weight:700;margin:26px 0 6px;color:var(--cardInk)}
.hint{color:var(--cardInk2);font-size:13.5px;margin:0 0 10px}
.dayh{margin:14px 2px 6px;font-weight:600;font-size:13.5px;color:var(--pageInk2)}
.bad{color:var(--danger)!important}
.empty{text-align:center;color:var(--pageInk2);padding:26px 14px;font-size:14.5px}

/* Atoms */
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--cardInk);display:grid;place-items:center;flex:none;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.card{background:var(--card);color:var(--cardInk);border-radius:var(--radius);padding:18px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);color:var(--cardInk);border-radius:calc(var(--radius) * .65);padding:12px 14px;margin-bottom:8px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.row .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.rtime{width:50px;flex:none;font-size:12.5px;color:var(--cardInk2);display:flex;flex-direction:column;line-height:1.25}
.rtime b{color:var(--cardInk);font-weight:650;font-size:14px}
.rbody{flex:1;min-width:0;display:block}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rt.wrap{white-space:normal}
.rs{font-size:13px;color:var(--cardInk2);display:block}
.done{text-decoration:line-through;opacity:.55}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:15px;height:15px;stroke-width:3}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.chk.sm{width:20px;height:20px;border-width:1.8px}.chk.sm svg{width:12px;height:12px}
.pb{min-width:24px;height:24px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none;padding:0 6px}
.pill{padding:5px 12px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:12.5px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.red{background:var(--danger);color:#fff}
.pill.big{padding:10px 18px;font-size:14.5px}
.seg{display:flex;background:var(--card);border-radius:16px;padding:3px;margin:14px 0}
.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:13px;font-weight:600;font-size:14px;color:var(--cardInk2)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);color:var(--cardInk);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;position:relative;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.chip.on{background:var(--accent);color:var(--accentInk)}
.chip .cdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.round,.chip.round.on{width:34px;height:34px;padding:0;justify-content:center;border:3px solid transparent;background:var(--cc)}
.chip.round.on{border-color:var(--cardInk)}
.chip.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.cpick{position:relative;width:38px;height:38px;border-radius:50%;background:var(--cc);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.cpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px;transition:width .4s}
.search{width:100%;background:var(--card);color:var(--cardInk);border:0;border-radius:18px;padding:13px 16px;outline:none;margin:14px 0 10px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.search::placeholder,.fld::placeholder,.li-in::placeholder,.cta::placeholder{color:var(--cardInk2)}
.grip{width:34px;height:34px;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;flex:none;cursor:grab}
.grip svg{fill:currentColor;stroke:none;width:20px;height:20px}

/* Home */
.homebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 14px;min-height:42px}
.hb{display:flex;gap:8px;margin-left:auto}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.widget{position:relative;grid-column:span 1;background:var(--card);color:var(--cardInk);border-radius:var(--radius);padding:16px;min-height:150px;overflow:hidden;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);min-width:0}
.widget.sz-M,.widget.sz-L{grid-column:span 2}
.widget.sz-L{min-height:320px}
.w-dark{--card:rgba(14,13,13,.95);--cardInk:#F6F1EC;--cardInk2:rgba(246,241,236,.6);--blur:0px}
.w-light{--card:rgba(255,252,249,.94);--cardInk:#241F1B;--cardInk2:rgba(36,31,27,.6);--blur:0px}
.w-glass{--card:rgba(255,255,255,.2);--cardInk:#fff;--cardInk2:rgba(255,255,255,.75);--blur:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.w-clear{--card:transparent;--cardInk:var(--pageInk);--cardInk2:var(--pageInk2);--blur:0px;box-shadow:none}
.w-accent{--card:var(--accent);--cardInk:var(--accentInk);--cardInk2:var(--accentInk);--blur:0px}
.widget .row{background:var(--chip);margin-bottom:6px}
.whead{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-weight:700;font-size:14px;margin-bottom:10px;gap:8px}
.whead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whead b{font-family:var(--fh);font-size:30px;font-weight:700;line-height:1}
.mi{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;min-width:0}
.mi>i{width:8px;height:8px;border-radius:50%;flex:none}
.mt{font-size:12px;color:var(--cardInk2);flex:none;min-width:44px}
.mx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.bd{padding:4px 0}.bd b{display:block;font-family:var(--fh);font-size:19px}
.clk{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:118px}
.clk-g{font-size:13.5px;color:var(--cardInk2);font-weight:500}
.clk-t{font-family:var(--fh);font-size:68px;font-weight:700;line-height:1;letter-spacing:-.02em;margin:2px 0}
.clk.sz-S .clk-t{font-size:42px}
.clk-d{font-size:15px;font-weight:500}
.wt-photo,.wt-strip{padding:0}
.wt-strip{padding:6px}
.ph{display:block;width:100%;background-size:cover;background-position:center;background-color:var(--chip);position:relative;border-radius:calc(var(--radius) * .75);overflow:hidden;color:var(--cardInk2);font-size:13px;text-align:center}
.wt-photo .ph{border-radius:0;aspect-ratio:1}
.wt-photo.sz-M .ph{aspect-ratio:16/10}.wt-photo.sz-L .ph{aspect-ratio:4/5}
.ph span{position:absolute;inset:0;display:grid;place-items:center}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-style:normal;font-family:var(--fh);font-size:16px;text-align:left}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.strip .ph{aspect-ratio:3/4;border-radius:calc(var(--radius) * .6)}
.wedit{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;justify-content:space-between;padding:8px;gap:6px;color:#fff;font-weight:600;font-size:13px}
.wedit>span{align-self:center;text-align:center;flex:1}
.wedit button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);color:#222;display:grid;place-items:center}
.wedit .grip svg{fill:#222}
.wbtns{display:flex;gap:6px}
.widget.sz-S .wedit>span:not(.wbtns){display:none}
.widget.sz-S .wedit{justify-content:space-between;padding:6px}
.widget.sz-S .wedit button{width:34px;height:34px}
.wgrid.editing .wbody{pointer-events:none;opacity:.8}
.widget.dragging{opacity:.5;transform:scale(.96)}
.addw{display:block;width:100%;margin-top:12px;border:2px dashed var(--pageInk2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--pageInk);font-weight:600}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.trow.dragging{opacity:.5}

/* Calendar */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .t{font-family:var(--fh);font-weight:700;font-size:32px;line-height:1.05}
.mnav .t small{display:block;font:500 14px var(--fb);color:var(--pageInk2)}
.mbtns{display:flex;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--cardInk2);padding:2px 0 6px}
.cd{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.sel{background:var(--accent);color:var(--accentInk)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cd.sel .dot{background:var(--accentInk);opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 2px 0;font-size:12.5px;color:var(--pageInk2);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}

/* Budget */
.bal{font-family:var(--fh);font-weight:700;font-size:46px;line-height:1;margin:4px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two b{display:block;font-family:var(--fh);font-size:22px;font-weight:700}
.two span{font-size:13px;color:var(--cardInk2)}
.catrow{margin-bottom:12px}
.catrow .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.catrow .l span:last-child{color:var(--cardInk2);font-weight:500}

<body>
<div id="splash" aria-hidden="true"></div>

<div id="app"><div id="main"></div></div>
<button id="fab" data-act="fab" aria-label="Neu hinzufügen"></button>
<nav id="tabs"><div class="pillbar" id="tabbar"></div></nav>

<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="studio"></div>

<script>
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ds(new Date());
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const diffDays = (a,b) => Math.round((pd(b) - pd(a)) / 86400000);
const wdIdx = d => (d.getDay() + 6) % 7;
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const longDate = s => { const x = pd(s); return `${WDL[wdIdx(x)]}, ${x.getDate()}. ${MONTHS[x.getMonth()]}`; };
const shortDate = s => { const x = pd(s); return `${x.getDate()}. ${MS[x.getMonth()]}`; };
const fmtTs = t => { const d = new Date(t); return `${d.getDate()}. ${MS[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const EUR = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR'});
const fmtE = n => EUR.format(n);
const fmtMin = m => m < 60 ? `${m} Min.` : `${(m/60).toFixed(1).replace('.0','').replace('.',',')} Std.`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const joinDe = a => a.length < 2 ? a.join('') : a.slice(0,-1).join(', ') + ' und ' + a[a.length-1];
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); i >= 0 ? arr[i] = o : arr.push(o); };
const clone = o => JSON.parse(JSON.stringify(o));
function dueLabel(d){
  const n = diffDays(today(), d);
  if (n === 0) return 'Heute'; if (n === 1) return 'Morgen'; if (n === -1) return 'Gestern';
  if (n < 0) return `Seit ${-n} Tagen überfällig`;
  if (n < 7) return WDL[wdIdx(pd(d))];
  return shortDate(d);
}
const countdown = d => { const n = diffDays(today(), d); return n === 0 ? 'Heute' : n === 1 ? 'Morgen' : n > 1 ? `in ${n} Tagen` : 'vorbei'; };
function seeded(arr, seed){
  const a = [...arr]; let s = seed || 1;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ================= Icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="4"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

function load(){
  const d = defaults();
  try {
    const r = localStorage.getItem(KEY);
    if (r){
      const o = JSON.parse(r);
      const s = Object.assign(d, o);
      s.settings = Object.assign(defaults().settings, o.settings || {});
      s.theme = Object.assign(baseTheme('cocoa'), o.theme || {});
      if (!o.ver || o.ver < 2){ // Migration von Version 1
        s.todos = (s.todos || []).map(t => ({...t, prio: t.prio === 2 ? 1 : t.prio === 1 ? 2 : 0, group: t.group || ''}));
        s.home = defaults().home; s.theme = baseTheme('cocoa');
      } else if (o.ver === 2){ // Version 2: Gebetszeiten-Widget ergänzen
        s.home = [...(s.home || [])]; s.home.splice(Math.min(1, s.home.length), 0, {id:uid(), type:'prayer', size:'M', style:'dark', cfg:{}});
      }
      if (!o.ver || o.ver < 4){ // Version 4: Blog, Moodboard, Zitate, Gedankenpalast entfernt; Prüfungsplan
        s.exams = s.exams || [];
        (s.subjects || []).forEach(sb => { if (sb.exam && !s.exams.some(x => x.sid === sb.id)) s.exams.push({id:uid(), sid:sb.id, title:sb.name, kind:'Klausur', date:sb.exam, start:'', end:'', room:'', reg:'', ects:'', status:'offen', grade:'', note:''}); });
      }
      ['quotes', 'know', 'board', 'blog', 'qoff', 'mail'].forEach(k => delete s[k]);
      s.home = (s.home || []).filter(w => !['quote', 'mood', 'mail'].includes(w.type));
      s.home.forEach(w => { if (w.type === 'bday'){ delete w.cfg.onlyToday; if (!w.cfg.count) w.cfg.count = 3; } });
      s.tt = s.tt || []; s.exams = s.exams || [];
      s.ver = 4;
      const dd = defaults();
      s.study = Object.assign(dd.study, o.study || {}); s.study.sem = Object.assign(dd.study.sem, (o.study || {}).sem || {});
      s.pray = Object.assign(dd.pray, o.pray || {}); s.pray.adj = Object.assign(dd.pray.adj, (o.pray || {}).adj || {});

function widgetHTML(w){
  const def = WT[w.type]; if (!def) return '';
  const inner = def.r(w);
  if (inner === null && !V.edit) return '';
  const body = inner === null ? `<div class="rs">${def.n}: erscheint nur, wenn etwas ansteht.</div>` : inner;
  const edit = V.edit ? `<div class="wedit"><button class="grip" data-grip aria-label="Verschieben">${I.grip}</button><span>${esc(def.n)}</span><span class="wbtns"><button data-act="wCfg" data-id="${w.id}" aria-label="Anpassen">${I.gear}</button><button data-act="wDel" data-id="${w.id}" aria-label="Entfernen">${I.x}</button></span></div>` : '';
  return `<section class="widget wt-${w.type} sz-${w.size} w-${w.style}" data-wid="${w.id}">${edit}<div class="wbody">${body}</div></section>`;
}
function greeting(){
  const h = new Date().getHours(), i = h < 5 ? 0 : h < 11 ? 1 : h < 18 ? 2 : 3;
  let l = S.settings.greet || 'de'; if (l === 'mix') l = ['de', 'tr', 'ku'][Math.abs(daySeed()) % 3];
  return GREET[l][i] + (S.settings.name ? ', ' + S.settings.name : '');
}
function tick(){
  const n = new Date();
  document.querySelectorAll('[data-clock]').forEach(el => {
    const k = el.dataset.clock;
    if (k === 'time') el.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}` + (el.dataset.s ? `:${pad(n.getSeconds())}` : '');
    else if (k === 'date') el.textContent = `${WDL[wdIdx(n)]}, ${n.getDate()}. ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
    else el.textContent = greeting();
  });
  const now = Date.now(); let expired = false;
  document.querySelectorAll('[data-cd]').forEach(el => {
    const rem = Number(el.dataset.cd) - now;
    if (rem <= 0){ expired = true; return; }
    el.textContent = el.dataset.cdf === 'big' ? fmtHMS(rem) : 'in ' + fmtCd(rem);
  });
  if (expired && now - (V.cdRender || 0) > 3000){ V.cdRender = now; render(); }
}

/* ---- Stundenplan ---- */
function vTT(){
  const t = today(), sem = S.study.sem;
  if (!S.tt.length) return `<div class="card"><p style="margin:0 0 6px;font-weight:650;font-size:17px">Dein Stundenplan</p>
    <p class="hint" style="margin:0 0 14px">Trage deine Vorlesungen, Übungen und Seminare einmal ein. Sie erscheinen dann jede Woche hier, im Kalender und auf der Startseite. Für Veranstaltungen, die nur alle zwei Wochen stattfinden, kannst du gerade oder ungerade Kalenderwochen wählen.</p>
    <button class="btn" style="margin:0" data-act="fab">Erste Veranstaltung eintragen</button><button class="btn ghost" data-act="semSheet">Semesterzeitraum festlegen</button></div>`;
  const mon = addDays(t, -wdIdx(pd(t)) + V.ttw * 7), kw = isoWeek(mon);
  const used = new Set(S.tt.map(x => Number(x.wd)));
  const days = [0, 1, 2, 3, 4, 5, 6].filter(i => i < 5 || used.has(i));
  let h0 = 24, h1 = 0;
  S.tt.forEach(x => { h0 = Math.min(h0, Math.floor(toMin(x.start) / 60)); h1 = Math.max(h1, Math.ceil(toMin(x.end || x.start) / 60)); });
  h0 = Math.min(h0, 8); h1 = Math.max(h1, h0 + 8, 16);
  const PX = 52, H = (h1 - h0) * PX, now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const cols = days.map(i => {
    const d = addDays(mon, i), all = S.tt.filter(x => Number(x.wd) === i).sort((a,b) => toMin(a.start) - toMin(b.start));
    const lanes = []; const pos = all.map(x => { let l = lanes.findIndex(e => e <= toMin(x.start)); if (l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = toMin(x.end || x.start) || toMin(x.start) + 90; return l; });
    const blocks = all.map((x, k) => {
      const on = ttOn(x, d), top = (toMin(x.start) - h0 * 60) / 60 * PX, ht = Math.max(26, ((toMin(x.end) || toMin(x.start) + 90) - toMin(x.start)) / 60 * PX - 3);
      const w = 100 / lanes.length;
      return `<button class="ttb ${on ? '' : 'off'}" style="top:${top}px;height:${ht}px;left:calc(${pos[k] * w}% + 1px);width:calc(${w}% - 2px);--c:${ttColor(x)}" data-act="editTT" data-id="${x.id}" data-d="${d}"><b>${esc(x.title)}</b><span>${x.start}${x.room ? ' · ' + esc(x.room) : ''}</span></button>`;
    }).join('');
    const nowLine = d === t && nowMin >= h0 * 60 && nowMin <= h1 * 60 ? `<i class="ttnow" style="top:${(nowMin - h0 * 60) / 60 * PX}px"></i>` : '';
    return `<div class="ttc ${d === t ? 'today' : ''}" style="height:${H}px">${blocks}${nowLine}</div>`;
  }).join('');
  const heads = days.map(i => { const d = addDays(mon, i); return `<div class="tth ${d === t ? 'today' : ''}"><b>${WD[i]}</b><span>${pd(d).getDate()}.</span></div>`; }).join('');
  const hrs = Array.from({length:h1 - h0}, (_, k) => `<span style="top:${k * PX}px">${h0 + k}</span>`).join('');
  const grid = `<div class="card ttwrap"><div class="ttg" style="--n:${days.length}"><div></div>${heads}<div class="tthrs" style="height:${H}px">${hrs}</div>${cols}</div></div>`;
  const nav = `<div class="dnav" style="margin-top:4px"><button class="iconbtn" data-act="ttw" data-v="-1" aria-label="Vorherige Woche">${I.left}</button><b>${V.ttw === 0 ? 'Diese Woche' : V.ttw === 1 ? 'Nächste Woche' : V.ttw === -1 ? 'Letzte Woche' : shortDate(mon) + ' bis ' + shortDate(addDays(mon, 6))}<small style="display:block;font:500 13px var(--fb);color:var(--pageInk2)">KW ${kw}, ${kw % 2 ? 'ungerade' : 'gerade'} Woche</small></b><button class="iconbtn" data-act="ttw" data-v="1" aria-label="Nächste Woche">${I.right}</button></div>`;
  const tl = ttDay(t), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let todayHtml = '';
  if (V.ttw === 0){
    todayHtml = `<div class="sec">Heute<small>${tl.length ? plural(tl.length, 'Termin', 'Termine') : 'frei'}</small></div>` + (tl.length ? tl.map(x => {

/* ================= Gebetszeiten (Diyanet-Methode) ================= */
const D2R = Math.PI / 180;
const dsin = d => Math.sin(d * D2R), dcos = d => Math.cos(d * D2R), dtan = d => Math.tan(d * D2R);
const dasin = x => Math.asin(x) / D2R, dacos = x => Math.acos(x) / D2R, datan2 = (y, x) => Math.atan2(y, x) / D2R, dacot = x => Math.atan(1 / x) / D2R;

  const L = fixN(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360), e = 23.439 - 0.00000036 * D;
  const RA = fixN(datan2(dcos(e) * dsin(L), dcos(L)) / 15, 24);
  return {decl:dasin(dsin(e) * dsin(L)), eqt:q / 15 - RA};
}
function prayerRaw(y, m, d, lat, lon, asrF){
  const jd = julianDay(y, m, d) - lon / 360;
  const mid = t => fixN(12 - sunPos(jd + t).eqt, 24);
  const ang = (a, t, ccw) => {
    const dc = sunPos(jd + t).decl, term = (-dsin(a) - dsin(dc) * dsin(lat)) / (dcos(dc) * dcos(lat));
    if (term > 1 || term < -1) return NaN;
    const h = dacos(term) / 15; return mid(t) + (ccw ? -h : h);
  };
  const asr = (f, t) => { const dc = sunPos(jd + t).decl; return ang(-dacot(f + dtan(Math.abs(lat - dc))), t, false); };
  const init = {fajr:5, sunrise:6, dhuhr:12, asr:13, sunset:18, isha:18};
  let est = {...init}, res = {};
  for (let i = 0; i < 2; i++){
    res = {fajr:ang(18, est.fajr / 24, true), sunrise:ang(0.833, est.sunrise / 24, true), dhuhr:mid(est.dhuhr / 24), asr:asr(asrF, est.asr / 24), sunset:ang(0.833, est.sunset / 24, false), isha:ang(17, est.isha / 24, false)};
    est = {}; for (const k in res) est[k] = isNaN(res[k]) ? init[k] : res[k];
  }
  return res;
}
function prayerTimes(dstr, L){
  const [y, m, d] = dstr.split('-').map(Number);
  const r = prayerRaw(y, m, d, L.lat, L.lon, S.pray.hanafi ? 2 : 1);
  if (isNaN(r.sunrise) || isNaN(r.sunset)) return null;
  const night = fixN(r.sunrise - r.sunset, 24);
  if (L.lat > 48){
    const portion = night / 7;
    if (isNaN(r.fajr) || fixN(r.sunrise - r.fajr, 24) > portion) r.fajr = r.sunrise - portion;
    if (isNaN(r.isha) || fixN(r.isha - r.sunset, 24) > portion) r.isha = r.sunset + portion;
  } else {
    if (isNaN(r.fajr)) r.fajr = r.sunrise - night * 18 / 60;
    if (isNaN(r.isha)) r.isha = r.sunset + night * 17 / 60;
  }
  const base = Date.UTC(y, m - 1, d), A = S.pray.adj;
  const ms = (h, k) => base + (h - L.lon / 15) * 3600000 + ((METHOD_ADJ[k] || 0) + (Number(A[k]) || 0)) * 60000;
  return {fajr:ms(r.fajr, 'fajr'), sunrise:ms(r.sunrise, 'sunrise'), dhuhr:ms(r.dhuhr, 'dhuhr'), asr:ms(r.asr, 'asr'), maghrib:ms(r.sunset, 'maghrib'), isha:ms(r.isha, 'isha')};
}
const getLoc = () => (S.pray.loc && S.pray.loc.lat != null) ? S.pray.loc : null;
const tzOf = L => L.mode === 'gps' ? Intl.DateTimeFormat().resolvedOptions().timeZone : (L.tz || 'Europe/Istanbul');
function dateInTz(ms, tz){
  const p = new Intl.DateTimeFormat('en-US', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(ms), g = t => p.find(x => x.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
const fmtClock = (ms, tz) => new Intl.DateTimeFormat('de-DE', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:tz}).format(ms);
function prayState(L, now = Date.now()){
  const tz = tzOf(L), dstr = dateInTz(now, tz);

  if (!t0 || !t1 || !tm) return null;
  const seq = [tm, t0, t1].flatMap(t => PORDER.map(k => ({k, t:t[k]})));
  const next = seq.find(x => x.t > now), prev = [...seq].reverse().find(x => x.t <= now);

}
const fmtCd = ms => { const s_ = Math.floor(ms / 1000), h = Math.floor(s_ / 3600), m = Math.floor(s_ % 3600 / 60), sec = s_ % 60; return h > 0 ? `${h} Std. ${m} Min.` : `${m} Min. ${pad(sec)} Sek.`; };
const fmtHMS = ms => { const s_ = Math.floor(ms / 1000); return `${pad(Math.floor(s_ / 3600))}:${pad(Math.floor(s_ % 3600 / 60))}:${pad(s_ % 60)}`; };
function qibla(lat, lon){
  const k = [21.4225, 39.8262], f1 = lat * D2R, f2 = k[0] * D2R, dl = (k[1] - lon) * D2R;
  const y = Math.sin(dl) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  return (Math.atan2(y, x) / D2R + 360) % 360;
}
const hav = (a, b, c, d) => { const dl = (c - a) * D2R, dn = (d - b) * D2R, x = Math.sin(dl / 2) ** 2 + Math.cos(a * D2R) * Math.cos(c * D2R) * Math.sin(dn / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
function nearestCity(lat, lon){ let best = null, bd = 1e9; CITIES.forEach(c => { const d = hav(lat, lon, c.la, c.lo); if (d < bd){ bd = d; best = c; } }); return bd < 40 ? best.n.split(' (')[0] : null; }
function locate(silent){
  if (!navigator.geolocation){ if (!silent) toast('Standort ist hier nicht verfügbar'); return; }
  const tok = V.locTok = (V.locTok || 0) + 1;
  navigator.geolocation.getCurrentPosition(p => {
    if (tok !== V.locTok) return; // inzwischen wurde manuell eine Stadt gewählt
    const la = p.coords.latitude, lo = p.coords.longitude;
    S.pray.loc = {mode:'gps', lat:la, lon:lo, ts:Date.now(), label:nearestCity(la, lo) || `${la.toFixed(2)}, ${lo.toFixed(2)}`};
    save(); render(); if (!silent) toast('Standort aktualisiert');
  }, () => { if (!silent) toast('Standort nicht verfügbar. Wähle eine Stadt.'); }, {timeout:12000, maximumAge:300000});
}
function autoLoc(){
  const L = S.pray.loc;
  if (L && L.mode === 'gps' && Date.now() - (L.ts || 0) > 15 * 60000 && Date.now() - (V.gpsTry || 0) > 60000){ V.gpsTry = Date.now(); locate(true); }
}

const zkCur = () => S.zikir.items.find(i => i.id === S.zikir.sel) || S.zikir.items[0];
function zkDef(z){
  if (z.seq){ const i = z.idx || 0, st = z.steps[i]; return {name:`${st.name} (${i + 1}/${z.steps.length})`, ar:st.ar, mean:st.mean, target:st.target}; }
  return {name:z.name, ar:z.ar, mean:z.mean, target:Number(z.target) || 0};
}
let zt;
function zkPaint(){
  const z = zkCur(); if (!z) return; const df = zkDef(z);
  document.querySelectorAll('[data-zkc]').forEach(el => el.textContent = z.count || 0);
  document.querySelectorAll('[data-zkr]').forEach(el => { const C = Number(el.dataset.c), p = df.target > 0 ? Math.min(1, (z.count || 0) / df.target) : 1; el.style.strokeDashoffset = C * (1 - p); });
  document.querySelectorAll('[data-zkt]').forEach(el => el.textContent = `Gesamt ${z.total || 0}, Runden ${z.rounds || 0}`);
  document.querySelectorAll('[data-zkd]').forEach(el => el.textContent = `Heute ${S.zikir.log[today()] || 0} Zikir`);
}
function zkTap(el){
  const z = zkCur(); if (!z) return;
  const df = zkDef(z); z.count = (z.count || 0) + 1; z.total = (z.total || 0) + 1;
  const dk = today(); S.zikir.log[dk] = (S.zikir.log[dk] || 0) + 1;
  let done = false;
  if (df.target > 0 && z.count >= df.target){
    done = true; z.count = 0;
    if (z.seq){ z.idx = (z.idx || 0) + 1; if (z.idx >= z.steps.length){ z.idx = 0; z.rounds = (z.rounds || 0) + 1; } } else z.rounds = (z.rounds || 0) + 1;
  }
  clearTimeout(zt); zt = setTimeout(save, 300);
  if (done){ save(); toast(z.seq ? (z.idx ? 'Geschafft, weiter mit ' + zkDef(z).name : 'Maşallah! Tesbihat ist vollständig 🤲') : `Maşallah! ${df.target} geschafft ✨`); render(); }
  else { zkPaint(); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

/* ================= Drag & drop sorting ================= */
function initSort(box, sel, done){
  box.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g || !box.contains(g)) return;
    const item = g.closest(sel); if (!item) return;
    e.preventDefault();
    item.classList.add('dragging');
    let y = e.clientY, raf;
    const sc = box.closest('#sheet') || window;
    const step = () => { if (y < 110) sc.scrollBy(0, -14); else if (y > innerHeight - 130) sc.scrollBy(0, 14); raf = requestAnimationFrame(step); };
    step();
    const move = ev => {
      y = ev.clientY;
      item.style.pointerEvents = 'none';
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      item.style.pointerEvents = '';
      const tgt = el && el.closest(sel);
      if (tgt && tgt !== item && tgt.parentElement === box){
        const kids = [...box.children];
        box.insertBefore(item, kids.indexOf(item) < kids.indexOf(tgt) ? tgt.nextSibling : tgt);
      }
    };
    const up = () => {
      cancelAnimationFrame(raf); item.classList.remove('dragging');
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      done([...box.children].filter(c => c.matches(sel)).map(c => c.dataset.wid));
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

  const ink = lumHex(bg) < .5 ? '#FBF6F1' : '#241F1B', aink = lumHex(ac) > .55 ? '#1B1714' : '#fff';
  return `<div style="background:${bg};color:${ink};border-radius:20px;padding:16px;display:flex;gap:10px;align-items:center"><div style="flex:1;min-width:0"><div style="font-family:${fam(fh)};font-size:26px;font-weight:700;line-height:1.1">${F.emoji ? esc(F.emoji) + ' ' : ''}${esc(F.label || '')}</div><div style="opacity:.7;font-size:13px;margin-top:2px">So sieht die Kategorie aus</div></div><span style="background:${ac};color:${aink};border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px">Aktiv</span></div>`;
}
function toolDesignSheet(id){
  const t = S.tools.find(x => x.id === id); if (!t) return;
  F = {id, label:t.label, emoji:t.emoji || '', accent:t.accent || '', bg:t.bg || '', fh:t.fh || ''};
  const sw = (f, list) => `<div class="chips"><button class="chip ${!F[f] ? 'on' : ''}" data-act="chip" data-f="${f}" data-v="">Standard</button>${list.map(c => `<button class="chip round ${F[f] === c ? 'on' : ''}" style="--cc:${c}" data-act="chip" data-f="${f}" data-v="${c}" aria-label="Farbe"></button>`).join('')}<label class="chip" style="position:relative">Eigene<input type="color" data-f="${f}" value="${F[f] || '#ffffff'}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"></label></div>`;
  sheet(`<h2 class="sh">Design: ${esc(t.label)}</h2><div id="tprev" style="margin:10px 0">${toolPrev()}</div>
    ${field('label', 'Name', 'text')}
    ${field('emoji', 'Symbol als Emoji (optional, ersetzt das Symbol unten)', 'text', 'maxlength="8" placeholder="z. B. 🌸"')}
    <div class="chips" style="margin-top:8px">${EMOJIS.map(e => `<button class="chip" style="padding:6px 10px;font-size:18px" data-act="tdEmo" data-v="${e}">${e}</button>`).join('')}<button class="chip" style="padding:8px 12px" data-act="tdEmo" data-v="">Kein Emoji</button></div>
    <label class="lab">Akzentfarbe dieser Kategorie</label>${sw('accent', AC_SW)}
    <label class="lab">Hintergrundfarbe dieser Kategorie</label>${sw('bg', BG_SW)}
    <label class="lab">Schrift der Überschrift</label><div class="chips"><button class="chip ${!F.fh ? 'on' : ''}" data-act="chip" data-f="fh" data-v="">Standard</button>${FONTS.map(f => `<button class="chip ${F.fh === f.n ? 'on' : ''}" style="font-family:${fam(f.n)}" data-act="chip" data-f="fh" data-v="${f.n}">${f.n}</button>`).join('')}</div>
    <button class="btn" data-act="tdSave" style="margin-top:20px">Speichern</button>
    <button class="btn ghost" data-act="tools">Zurück</button>`);
}

  editSub(d){ subSheet(d.id); }, addSes(d){ sesSheet(null, d.id); }, editSes(d){ sesSheet(d.id); },
  tgSes(d){ const s = S.sessions.find(x => x.id === d.id); if (s){ s.done = !s.done; save(); render(); } },
  saveSub(){
    if (!(F.name || '').trim()) return toast('Bitte einen Namen eingeben');
    const old = S.subjects.find(x => x.id === F.id);
    const o = {id:F.id || uid(), name:F.name.trim(), color:F.color, exam:F.exam || '', days:F.days || [], min:Math.max(10, Number(F.min) || 60), topics:(F.items || []).filter(i => i.t.trim()).map(i => ({t:i.t.trim(), done:!!i.done}))};
    upsert(S.subjects, o); let msg = 'Gespeichert';
    if (o.exam){
      const lk = S.exams.find(x => x.sid === o.id && (!old || x.date === old.exam || !x.date));
      if (lk) lk.date = o.exam;
      else if (!S.exams.some(x => x.sid === o.id && x.date === o.exam)) S.exams.push({id:uid(), sid:o.id, title:o.name, kind:'Klausur', date:o.exam, start:'', end:'', room:'', reg:'', ects:'', status:'offen', grade:'', attempt:1, note:''});
    }

  saveExam(){

  noteKind(d, el){ F.kind = d.v; if (F.kind === 'list' && !F.items.length) F.items = [{t:'', done:false}]; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); $('#nbody').innerHTML = noteBody(); },

  liDel(d){ F.items.splice(d.i, 1); if (!F.items.length) F.items.push({t:'', done:false}); relist(); },
  liAdd(){ F.items.push({t:'', done:false}); relist(); const a = document.querySelectorAll('#sheet .li-in'); a[a.length - 1]?.focus(); },
  liClean(){ F.items = F.items.filter(i => !i.done); if (!F.items.length) F.items.push({t:'', done:false}); relist(); },
  saveNote(){

    if (F.kind === 'list' && !title) title = 'Liste';
    if (F.kind === 'note' && !title) title = (F.body || '').trim().split('\n')[0].slice(0, 40);
    if (!title && !(F.body || '').trim() && !items.length) return toast('Die Notiz ist noch leer');
    upsert(S.notes, {id:F.id || uid(), kind:F.kind, title:title || 'Ohne Titel', body:F.kind === 'note' ? (F.body || '') : '', items:F.kind === 'list' ? items : [], color:F.color || 0, pin:!!F.pin, ts:Date.now()});

  pdPrev(){ const L = getLoc(); V.pd = addDays(V.pd || dateInTz(Date.now(), tzOf(L)), -1); render(); },
  pdNext(){ const L = getLoc(); V.pd = addDays(V.pd || dateInTz(Date.now(), tzOf(L)), 1); render(); },

  zkReset(d, el){

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (fn) fn(t.dataset, t, e);
});
const onField = e => {
  const t = e.target;
  if (t.dataset.t){ T[t.dataset.t] = t.type === 'range' ? Number(t.value) : t.value; applyTheme(T); }
  else if (t.dataset.f){
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.num) v = Number(v);
    setF(t.dataset.f, v); refreshPrev();
  }
  else if (t.dataset.li !== undefined) F.items[Number(t.dataset.li)].t = t.value;
  else if (t.dataset.mi !== undefined){ F.items[Number(t.dataset.mi)][t.dataset.mf] = t.value; if (t.dataset.mf === 'color') t.parentElement.style.setProperty('--cc', t.value); }
  else if (t.dataset.tl){ const x = F.tools.find(o => o.id === t.dataset.tl); if (x) x.label = t.value; }
  else if (t.dataset.cq !== undefined){ if (e.type === 'input'){ const c = $('#clist'); if (c) c.innerHTML = cityList(t.value); } }
  else if (t.dataset.q && e.type === 'input'){ V[t.dataset.q] = t.value; const k = t.dataset.q, pos = t.selectionStart; render(); const n = document.querySelector(`[data-q=${k}]`); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_) {} } }
};
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'qt' && t.value.trim()){
    S.todos.push({id:uid(), title:t.value.trim(), due:'', prio:0, group:V.tg !== 'all' ? V.tg : '', done:false, ts:Date.now()}); save(); render(); $('#qt').focus();
  } else if (t.dataset.li !== undefined){
    e.preventDefault(); const i = Number(t.dataset.li);
    F.items.splice(i + 1, 0, {t:'', done:false}); relist(); document.querySelectorAll('#sheet .li-in')[i + 1]?.focus();
  }
});
let sx = 0, sy = 0;
$('#main').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$('#main').addEventListener('touchend', e => {
  if (V.view !== 'cal' || !e.target.closest('.cal')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? A.nextM() : A.prevM();
}, {passive:true});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet.open') && !$('#studio.open')){ V.sel = V.view === 'cal' ? V.sel : V.sel; render(); } });
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-zk]'); if (!t || V.edit) return; e.preventDefault(); zkTap(t); });
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else autoLoc(); });

const lgTile = (k, round = true) => { const c = LG[k]; return `<svg class="lg" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" ${round ? 'rx="28"' : ''} fill="${c.bg}"/><g transform="translate(18.75 18.75) scale(.3289)">${lgMark(c, 'x')}</g></svg>`; };
const lgWord = c => `<path fill-rule="evenodd" fill="${c.w1}" d="${LG_W1}"/><path fill-rule="evenodd" fill="${c.w2}" d="${LG_W2}"/>`;
function logoPill(){
  const c = LG[lgKey()];
  return `<button class="homelogo" data-act="logoPlay" aria-label="Benim Köşem, Animation abspielen"><svg class="lg hl-mark" viewBox="0 0 190 190" aria-hidden="true">${lgMark(c, 'h')}</svg><svg class="lg hl-word" viewBox="466 172 519 86" aria-hidden="true"><path fill-rule="evenodd" fill="${c.w1}" d="${LG_W1}"/><g transform="translate(255 -92)"><path fill-rule="evenodd" fill="${c.w2}" d="${LG_W2}"/></g></svg></button>`;
}
function splashHTML(k){
  const c = LG[k];
  return `<div class="sp-in"><svg class="lg sp-mark" viewBox="0 0 190 190" role="img" aria-label="Benim Köşem">${lgMark(c, 'sp')}</svg><svg class="lg sp-word" viewBox="466 172 264 178" aria-hidden="true"><g class="sp-w1"><path fill-rule="evenodd" fill="${c.w1}" d="${LG_W1}"/></g><g class="sp-w2"><path fill-rule="evenodd" fill="${c.w2}" d="${LG_W2}"/></g></svg></div>`;
}
function iconPNG(k, size, cb){
  const c = LG[k];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c.bg}"/><g transform="translate(18.75 18.75) scale(.3289)">${lgMark(c, 'i')}</g></svg>`;
  const img = new Image();
  img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.getContext('2d').drawImage(img, 0, 0, size, size); cb(cv.toDataURL('image/png')); } catch(e) {} };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function setLink(rel, id, href, sizes){
  const old = document.getElementById(id), n = document.createElement('link');
  n.rel = rel; n.id = id; if (sizes) n.sizes = sizes; n.href = href;
  old ? old.replaceWith(n) : document.head.appendChild(n);
}
function applyLogo(){
  const k = lgKey();
  document.documentElement.dataset.logo = k;
  iconPNG(k, 180, u => setLink('apple-touch-icon', 'appicon', u, '180x180'));
  iconPNG(k, 64, u => setLink('icon', 'favicon', u, '64x64'));
}
let spT = null;
function playSplash(enter){
  const el = $('#splash'); if (!el) return;
  clearTimeout(spT);
  el.className = 'play'; el.innerHTML = splashHTML(lgKey()); el.onpointerdown = null;
  const finish = () => {
    clearTimeout(spT); el.onpointerdown = null; el.classList.add('out');
    if (enter === true){ document.body.classList.add('enter'); setTimeout(() => document.body.classList.remove('enter'), 900); }
    spT = setTimeout(() => el.classList.add('gone'), 520);
  };
  spT = setTimeout(finish, 2300);
  el.onpointerdown = finish;
}

/* ================= Start ================= */
$('#fab').innerHTML = I.plus;
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
applyTheme(S.theme);
render();
applyLogo();
if (S.settings.splash !== false) playSplash(true);
autoLoc();
</script>
</body>
</html>
